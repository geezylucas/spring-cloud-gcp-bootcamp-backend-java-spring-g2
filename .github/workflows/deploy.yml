name: Deploy a Cloud Run (API + función)

# CD: al hacer push a main (o manualmente) se prueba, se construye la imagen y se despliega
on:
  push:
    branches: [main]
    paths: ['pokedex-api/**', 'functions/**', '.github/workflows/deploy.yml']
  workflow_dispatch:

# Necesario para WIF: el job pide un token OIDC a GitHub
permissions:
  contents: read
  id-token: write

env:
  # Variables del repositorio (Settings → Secrets and variables → Actions → Variables)
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: ${{ vars.GCP_REGION }}            # p. ej. us-central1
  SERVICE: pokedex-api
  FUNCTION_SERVICE: pokemon-of-the-day
  FUNCTION_ENTRYPOINT: com.codigofacilito.cloud.PokemonOfTheDay
  REPOSITORY: pokedex                       # repositorio de Artifact Registry
  IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/pokedex/pokedex-api

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: mvn -B verify
        working-directory: pokedex-api

  test-function:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: mvn -B verify
        working-directory: functions/pokemon-of-the-day

  # La función se despliega primero: la API necesita su URL
  deploy-function:
    needs: test-function
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.url.outputs.url }}
    steps:
      - uses: actions/checkout@v5
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Desplegar la función (Cloud Run functions, Java 25)
        run: |
          gcloud run deploy "${FUNCTION_SERVICE}" \
            --project "${PROJECT_ID}" --region "${REGION}" \
            --source functions/pokemon-of-the-day \
            --function "${FUNCTION_ENTRYPOINT}" \
            --base-image java25 \
            --allow-unauthenticated --max-instances 2 --quiet
      - id: url
        run: |
          URL="$(gcloud run services describe "${FUNCTION_SERVICE}" \
            --project "${PROJECT_ID}" --region "${REGION}" --format='value(status.url)')"
          echo "url=${URL}" >> "$GITHUB_OUTPUT"
      - name: Prueba de humo de la función
        run: curl --fail --silent --show-error --retry 5 --retry-delay 3 "${{ steps.url.outputs.url }}"

  deploy:
    needs: [test, deploy-function]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Autenticación SIN llaves: Workload Identity Federation
      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Docker → Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      # Imagen inmutable: la etiqueta es el SHA del commit
      - name: Build y push de la imagen
        run: |
          docker build -t "${IMAGE}:${GITHUB_SHA}" pokedex-api
          docker push "${IMAGE}:${GITHUB_SHA}"

      - id: deploy
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          image: ${{ env.IMAGE }}:${{ github.sha }}
          flags: --allow-unauthenticated --max-instances=2
          env_vars: |
            FUNCTION_URL=${{ needs.deploy-function.outputs.url }}

      - name: Prueba de humo
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 3 \
            "${{ steps.deploy.outputs.url }}/actuator/health"
