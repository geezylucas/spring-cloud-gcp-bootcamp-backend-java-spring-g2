name: CI

# CI: en cada Pull Request y en cada push a una rama que no sea main
on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  api:
    name: pokedex-api · build + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build y tests
        run: mvn -B verify
        working-directory: pokedex-api

  function:
    name: pokemon-of-the-day · build + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build y tests
        run: mvn -B verify
        working-directory: functions/pokemon-of-the-day
