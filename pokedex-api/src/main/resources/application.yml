spring:
  application:
    name: pokedex-api

# 12 factores: el puerto lo decide la plataforma. Cloud Run inyecta PORT.
server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

# API pública que consumimos (se puede cambiar por variable de entorno)
pokeapi:
  base-url: ${POKEAPI_BASE_URL:https://pokeapi.co/api/v2}

# URL de la Cloud Run function "pokemon-of-the-day". Vacía = se usa la elección local.
daily:
  function-url: ${FUNCTION_URL:}
